AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portfolio deployment prerequisites, created once by an administrator: GitHub
  Actions OIDC trust, the GitHub deploy role, the CloudFormation execution
  role, the Lambda permissions boundary, and the Lambda artifacts bucket.
  See docs/architecture/deployment.md.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organization that owns the repository.
    AllowedPattern: "[A-Za-z0-9-]+"
  GitHubRepository:
    Type: String
    Description: Repository name, without the owner.
    AllowedPattern: "[A-Za-z0-9._-]+"
  GitHubEnvironment:
    Type: String
    Description: GitHub environment whose deploy jobs may assume the deploy role.
    Default: production
  AppStackName:
    Type: String
    Description: Name of the application stack (infra/portfolio.yaml).
    Default: portfolio-production
  ExistingOidcProviderArn:
    Type: String
    Description: >-
      ARN of an existing token.actions.githubusercontent.com OIDC provider in
      this account. Leave empty to create one.
    Default: ""

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppStackName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldPackages
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # Upper bound on the Lambda execution role, whatever the app template asks for.
  LambdaPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppStackName}-lambda-boundary"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"

  # Assumed by CloudFormation to create and update the application stack.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cfn-exec-${AppStackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-application-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LambdaFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:Get*
                  - lambda:List*
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"
              - Sid: LambdaWebAdapterLayer
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:*"
              - Sid: ReadLambdaPackage
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: CreateBoundedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref LambdaPermissionsBoundary
              - Sid: ManageRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: PassRolesToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: AssetsBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketTagging
                  - s3:Get*
                  - s3:List*
                Resource: !Sub "arn:aws:s3:::${AppStackName}-assets-${AWS::AccountId}-${AWS::Region}"
              - Sid: CloudFrontDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              # CloudFront policy and origin access control actions do not all
              # support resource-level permissions.
              - Sid: CloudFrontPolicies
                Effect: Allow
                Action:
                  - cloudfront:CreateCachePolicy
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:DeleteCachePolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetCachePolicyConfig
                  - cloudfront:ListCachePolicies
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicyConfig
                  - cloudfront:ListResponseHeadersPolicies
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:ListOriginRequestPolicies
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:ListOriginAccessControls
                Resource: "*"

  # Assumed by the GitHub Actions deploy job through OIDC; no long-lived keys.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "github-deploy-${AppStackName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: deploy-application
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ApplicationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadLambdaPackage
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: UploadStaticAssets
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${AppStackName}-assets-${AWS::AccountId}-${AWS::Region}/*"
              - Sid: ListDeploymentBuckets
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "arn:aws:s3:::${AppStackName}-assets-${AWS::AccountId}-${AWS::Region}"
              - Sid: InvalidateCdn
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"

Outputs:
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Description: GitHub variable AWS_CLOUDFORMATION_ROLE_ARN.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  ArtifactsBucketName:
    Description: GitHub variable AWS_ARTIFACTS_BUCKET.
    Value: !Ref ArtifactsBucket

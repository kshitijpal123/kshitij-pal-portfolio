AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portfolio production: CloudFront in front of the Next.js standalone server on
  AWS Lambda (function URL, Lambda Web Adapter), an S3 bucket for
  /_next/static, a DynamoDB table for the private console, a KMS key for its
  Gmail credentials, and EventBridge Scheduler with a short-lived function for
  its scheduled sends. Deployed by GitHub Actions; see
  docs/architecture/deployment.md.

Parameters:
  LambdaAdapterLayerVersion:
    Type: Number
    Description: Version of the AWS Lambda Web Adapter layer (LambdaAdapterLayerX86).
    Default: 30
  ResendApiKey:
    Type: String
    Description: Resend API key. Empty disables delivery (POST /api/contact returns 500).
    Default: ""
    NoEcho: true
  ContactToEmail:
    Type: String
    Description: Inbox that receives contact form messages.
    Default: ""
  ContactFromEmail:
    Type: String
    Description: Resend-verified sender, for example "Portfolio <contact@domain.tld>".
    Default: ""
  AdminBootstrapToken:
    Type: String
    Description: >-
      One-time private console setup token (32+ characters). Empty, the default,
      closes /admin/setup; it also closes for good once the OWNER exists.
    Default: ""
    NoEcho: true
  SiteUrl:
    Type: String
    Description: >-
      Public origin (the GitHub variable SITE_URL), used only to derive the
      Google OAuth redirect URI. Empty leaves Gmail connection unavailable.
    Default: ""
  GoogleClientId:
    Type: String
    Description: Google OAuth web client ID for Gmail connection. Empty disables it.
    Default: ""
  GoogleClientSecret:
    Type: String
    Description: Google OAuth web client secret. Empty disables Gmail connection.
    Default: ""
    NoEcho: true

Conditions:
  HasSiteUrl: !Not [!Equals [!Ref SiteUrl, ""]]

Resources:
  # Private mail console data (users, invitations, sessions, sender identities).
  # Retained if the stack is deleted or the table would be replaced.
  AdminTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-admin"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  # Envelope encryption of the console's Gmail OAuth refresh tokens. The
  # account may administer the key but not use it; only the server function
  # may, and only for data keys whose encryption context names this purpose.
  GmailTokenKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Private console Gmail OAuth refresh-token encryption.
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministersKey
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
          - Sid: ServerFunctionEncryptsGmailTokens
            Effect: Allow
            Principal:
              AWS: !GetAtt ServerFunctionRole.Arn
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:EncryptionContext:purpose: gmail-oauth-refresh-token
          # Scheduled sends refresh Gmail access tokens (and re-encrypt a
          # rotated refresh token) exactly as a send from the console does.
          - Sid: ScheduleFunctionEncryptsGmailTokens
            Effect: Allow
            Principal:
              AWS: !GetAtt ScheduleFunctionRole.Arn
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:EncryptionContext:purpose: gmail-oauth-refresh-token

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-assets-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsStaticAssets
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/_next/static/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-server"
      RetentionInDays: 30

  ServerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${AWS::StackName}-lambda-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ServerLogGroup.Arn
        # Item access to the one table; transactions use these same actions.
        - PolicyName: admin-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt AdminTable.Arn

  # Creates and deletes the triggers of the console's schedules, in their
  # group only, and lets Scheduler use only the invoke role. A separate
  # resource because GmailTokenKey depends on ServerFunctionRole.
  ServerFunctionSchedulePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ServerFunctionRole
      PolicyName: schedule-triggers
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - scheduler:CreateSchedule
              - scheduler:DeleteSchedule
            Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroup}/*"
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt SchedulerInvokeRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: scheduler.amazonaws.com

  ServerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ServerFunctionSchedulePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-server"
      Description: Next.js standalone server behind the Lambda Web Adapter.
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Handler: run.sh
      # Replaced with an S3 location by `aws cloudformation package`.
      Code: ../.aws-build/server
      MemorySize: 1024
      Timeout: 15
      Role: !GetAtt ServerFunctionRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:${LambdaAdapterLayerVersion}"
      LoggingConfig:
        LogGroup: !Ref ServerLogGroup
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          PORT: "8000"
          RESEND_API_KEY: !Ref ResendApiKey
          CONTACT_TO_EMAIL: !Ref ContactToEmail
          CONTACT_FROM_EMAIL: !Ref ContactFromEmail
          ADMIN_TABLE_NAME: !Ref AdminTable
          ADMIN_BOOTSTRAP_TOKEN: !Ref AdminBootstrapToken
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          # Must match lib/admin/googleOAuth.ts and the Google OAuth client.
          GOOGLE_OAUTH_REDIRECT_URI: !If
            - HasSiteUrl
            - !Sub "${SiteUrl}/admin/oauth/google/callback"
            - ""
          GMAIL_TOKEN_KMS_KEY_ID: !GetAtt GmailTokenKey.Arn
          SCHEDULER_GROUP_NAME: !Ref ScheduleGroup
          SCHEDULER_TARGET_ARN: !GetAtt ScheduleFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn

  # Scheduled sends: EventBridge Scheduler holds one trigger per schedule in
  # this group and, when an occurrence is due, invokes ScheduleFunction with
  # only the schedule's ID and time. Nothing runs between occurrences.
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${AWS::StackName}-mail"

  ScheduleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-scheduler"
      RetentionInDays: 30

  ScheduleFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${AWS::StackName}-lambda-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ScheduleLogGroup.Arn
        # Reads schedules, claims occurrences, and records sends; it never
        # deletes items.
        - PolicyName: admin-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt AdminTable.Arn
        # Deletes triggers that must not fire again; it cannot create any.
        - PolicyName: remove-schedule-triggers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: scheduler:DeleteSchedule
                Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroup}/*"

  # No function URL and no resource-based policy: only SchedulerInvokeRole
  # can invoke it.
  ScheduleFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scheduler"
      Description: Sends one due occurrence of a private console schedule.
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Handler: index.handler
      # Built by infra/package-scheduler.mts; replaced with an S3 location by
      # `aws cloudformation package`.
      Code: ../.aws-build/scheduler
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ScheduleFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ScheduleLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          ADMIN_TABLE_NAME: !Ref AdminTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_OAUTH_REDIRECT_URI: !If
            - HasSiteUrl
            - !Sub "${SiteUrl}/admin/oauth/google/callback"
            - ""
          GMAIL_TOKEN_KMS_KEY_ID: !GetAtt GmailTokenKey.Arn
          SCHEDULER_GROUP_NAME: !Ref ScheduleGroup

  # Scheduler invokes asynchronously. Lambda retries a failed invocation once
  # and drops events older than the occurrence's lateness window; repeats are
  # harmless because each occurrence is claimed once.
  ScheduleFunctionInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ScheduleFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600

  # Assumed only by EventBridge Scheduler, for this account's triggers in the
  # console's group, to invoke only ScheduleFunction.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${AWS::StackName}-lambda-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${AWS::StackName}-mail/*"
      Policies:
        - PolicyName: invoke-schedule-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScheduleFunction.Arn

  # AWS_IAM (CloudFront origin access control) would require browsers to sign
  # POST bodies with x-amz-content-sha256, which the contact form cannot do.
  ServerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ServerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  ServerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ServerFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  AssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-assets"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Honors the origin's Cache-Control (s-maxage on prerendered pages, none on
  # dynamic responses). The RSC headers and every query string (_rsc) are in
  # the key so HTML and React Server Component payloads never share an entry.
  ServerCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-server"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - rsc
              - next-router-prefetch
              - next-router-state-tree
              - next-router-segment-prefetch
              - next-url
          QueryStringsConfig:
            QueryStringBehavior: all

  # Mirrors the headers in next.config.ts for responses served from S3.
  StaticAssetsHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-static-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=()
              Override: true

  # The custom domain (alias and its us-east-1 ACM certificate) is attached
  # outside this template. Any change to this resource makes CloudFormation
  # rewrite the distribution config without it; read "Custom domain" in
  # docs/architecture/deployment.md first.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} portfolio"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: server
            DomainName:
              !Select [2, !Split ["/", !GetAtt ServerFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
          - Id: assets
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AssetsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref ServerCachePolicy
          # Managed AllViewerExceptHostHeader: a function URL only accepts its own Host.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed CachingOptimized.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref StaticAssetsHeadersPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  DistributionUrl:
    Description: >-
      Default *.cloudfront.net origin of the distribution. Not canonical: the
      public origin is the custom domain in the GitHub variable SITE_URL.
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  AssetsBucketName:
    Value: !Ref AssetsBucket
  ServerFunctionName:
    Value: !Ref ServerFunction
  AdminTableName:
    Value: !Ref AdminTable
  GmailTokenKeyArn:
    Value: !GetAtt GmailTokenKey.Arn
  ScheduleFunctionName:
    Value: !Ref ScheduleFunction

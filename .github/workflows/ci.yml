name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deployment part-way through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      STACK_NAME: portfolio-production
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_ARTIFACTS_BUCKET: ${{ vars.AWS_ARTIFACTS_BUCKET }}
      CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
      CONTACT_FROM_EMAIL: ${{ vars.CONTACT_FROM_EMAIL }}
      SITE_URL: ${{ vars.SITE_URL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - name: Check deployment configuration
        run: |
          missing=0
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_ROLE_ARN AWS_ARTIFACTS_BUCKET SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set on the production environment. See docs/architecture/deployment.md."
              missing=1
            fi
          done
          case "$SITE_URL" in
            https://*/*) invalid=1 ;;
            https://?* | "") invalid=0 ;;
            *) invalid=1 ;;
          esac
          if [ "$invalid" = 1 ]; then
            echo "::error::SITE_URL must be a bare https:// origin without a trailing slash, for example https://domain.tld."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble Lambda package
        run: node infra/package-server.mts

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Assets go up before the new server so fresh HTML never references a
      # missing file. Old hashed files are kept for pages still cached.
      - name: Upload static assets (existing stack)
        run: |
          bucket=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsBucketName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$bucket" ] && [ "$bucket" != "None" ]; then
            aws s3 sync .next/static "s3://$bucket/_next/static" \
              --cache-control "public, max-age=31536000, immutable"
          else
            echo "Stack not created yet; assets are uploaded after the first deploy."
          fi

      - name: Package CloudFormation template
        run: |
          aws cloudformation package \
            --template-file infra/portfolio.yaml \
            --s3-bucket "$AWS_ARTIFACTS_BUCKET" \
            --s3-prefix "$STACK_NAME" \
            --output-template-file .aws-build/portfolio.packaged.yaml

      - name: Deploy stack
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Optional; empty keeps /admin/setup closed. Remove it after setup.
          ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          # Optional; empty leaves Gmail connection unavailable.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file .aws-build/portfolio.packaged.yaml \
            --role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "ResendApiKey=$RESEND_API_KEY" \
              "ContactToEmail=$CONTACT_TO_EMAIL" \
              "ContactFromEmail=$CONTACT_FROM_EMAIL" \
              "AdminBootstrapToken=$ADMIN_BOOTSTRAP_TOKEN" \
              "SiteUrl=$SITE_URL" \
              "GoogleClientId=$GOOGLE_CLIENT_ID" \
              "GoogleClientSecret=$GOOGLE_CLIENT_SECRET"

      - name: Read stack outputs
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "bucket=$(output AssetsBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(output DistributionId)" >> "$GITHUB_OUTPUT"
          echo "distribution_url=$(output DistributionUrl)" >> "$GITHUB_OUTPUT"

      - name: Upload static assets
        run: |
          aws s3 sync .next/static "s3://${{ steps.stack.outputs.bucket }}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.stack.outputs.distribution }}" --id "$id"

      - name: Smoke test
        env:
          DISTRIBUTION_URL: ${{ steps.stack.outputs.distribution_url }}
        run: |
          check() {
            status=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" "$SITE_URL$2")
            echo "$1 $SITE_URL$2 -> $status"
            [ "$status" = "$3" ]
          }
          check GET / 200
          check GET /work/billsync 200
          check GET /robots.txt 200
          check GET /sitemap.xml 200
          check GET /api/contact 405
          check GET /this-page-does-not-exist 404
          curl -sf "$SITE_URL/robots.txt" | grep -qx "Sitemap: $SITE_URL/sitemap.xml" \
            || { echo "::error::robots.txt does not list $SITE_URL/sitemap.xml"; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" "$DISTRIBUTION_URL/")
          echo "GET $DISTRIBUTION_URL/ -> $status"
          [ "$status" = "200" ]
